      <line x1="81" y1="-140.4" x2="86" y2="-149"/>
      <line x1="140.4" y1="-81" x2="149" y2="-86"/>
      <line x1="162" y1="0" x2="172" y2="0"/>
      <line x1="140.4" y1="81" x2="149" y2="86"/>
      <line x1="81" y1="140.4" x2="86" y2="149"/>
      <line x1="0" y1="162" x2="0" y2="172"/>
      <line x1="-81" y1="140.4" x2="-86" y2="149"/>
